{% load i18n %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light">
<title>decanID</title>
<style>
body,table,td,p { font-family: Arial, Helvetica, sans-serif; color:#202823; }
h1,h2 { font-family:Georgia,"Times New Roman",serif; font-weight:normal; font-size:32px; line-height:1.2; margin:0 0 24px; }
a { color:#28533b; }
.btn-primary { background:#28533b; border-radius:5px; text-align:center; }
.btn-primary a { display:inline-block; padding:14px 24px; color:#fffefa !important; font-size:16px; font-weight:bold; text-decoration:none; }
.properties-table { width:100%; font-size:14px; border-collapse:collapse; }
.properties-table td { padding:8px; vertical-align:top; overflow-wrap:anywhere; }
.td-right { text-align:right; }
@media screen and (max-width:600px) { .email-shell { width:100% !important; } .email-padding { padding:36px 24px !important; } h1,h2 { font-size:28px !important; } }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f6f4ed;color:#202823;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f6f4ed" style="background-color:#f6f4ed;">
<tr><td align="center">
<table role="presentation" class="email-shell" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;">
<tr><td class="email-padding" style="padding:56px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr><td align="left" style="padding-bottom:40px;"><img src="{% block logo_url %}cid:logo{% endblock %}" alt="decanID" width="220" height="55" style="display:block;width:220px;max-width:100%;height:auto;border:0;"></td></tr>
{% block content %}{% endblock %}
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:28px;">{% block sub_content %}{% endblock %}</table>
<p style="margin:36px 0 0;font-size:13px;line-height:1.6;color:#59645b;">decanID · Your Decan Cloud account<br><a href="https://sso.decaneva.cloud/" style="color:#28533b;text-decoration:underline;">Manage your account</a></p>
</td></tr></table>
</td></tr></table>
</body></html>
